name: Sync WeRead notes & deploy site

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "sync.py", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export notes from WeRead
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: python sync.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A notes README.md site/data.json
          if git diff --cached --quiet; then
            echo "No new notes."
          else
            git commit -m "Sync WeRead notes $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
