<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>读书笔记</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root {
  --bg: #faf8f4; --panel: #ffffff; --text: #26231f; --muted: #7a736a; --faint: #b5ada2;
  --line: #e9e4dc; --accent: #9a5b2e; --accent-soft: #f3e6da; --mark: #ffe8a3;
  --quote: #c9b8a6; --shadow: 0 1px 3px rgba(60,40,20,.08), 0 4px 16px rgba(60,40,20,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1816; --panel: #23201d; --text: #e8e2d9; --muted: #a39a8e; --faint: #6d655c;
    --line: #36312c; --accent: #e0a070; --accent-soft: #3a2c21; --mark: #6b5418;
    --quote: #5c5045; --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1816; --panel: #23201d; --text: #e8e2d9; --muted: #a39a8e; --faint: #6d655c;
  --line: #36312c; --accent: #e0a070; --accent-soft: #3a2c21; --mark: #6b5418;
  --quote: #5c5045; --shadow: 0 1px 3px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; padding: 14px 0; }
.brand { font-weight: 700; font-size: 18px; color: var(--text); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.search { flex: 1; position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 15px; padding: 9px 14px 9px 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); outline: none;
}
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.icon-btn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
  height: 38px; min-width: 38px; cursor: pointer; font: inherit; font-size: 14px; padding: 0 10px; }
.icon-btn:hover { color: var(--text); border-color: var(--faint); }

.stats { display: flex; gap: 28px; flex-wrap: wrap; padding: 28px 0 8px; }
.stat b { display: block; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }

.daily { margin: 20px 0 8px; padding: 20px 24px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
.daily .lbl { font-size: 12px; color: var(--muted); letter-spacing: .08em; display: flex; justify-content: space-between; }
.daily .lbl button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; }
.daily blockquote { margin: 8px 0 6px; font-size: 17px; }
.daily .src { color: var(--muted); font-size: 13px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 20px 0 14px; }
.chip { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
select.chip { padding-right: 8px; }
.spacer { flex: 1; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 18px; padding-bottom: 60px; }
.card { color: var(--text); display: block; }
.card:hover { text-decoration: none; }
.card:hover .cover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(60,40,20,.15); }
.cover { aspect-ratio: 3/4.2; width: 100%; border-radius: 6px; object-fit: cover; background: var(--line);
  box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; display: block; }
.cover.ph { display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center;
  color: var(--muted); font-size: 14px; background: var(--accent-soft); }
.card .t { margin-top: 8px; font-size: 14px; font-weight: 600; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .n { font-size: 12px; color: var(--faint); }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; }

/* search results */
.results { padding: 20px 0 60px; }
.results h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 18px 0 10px; letter-spacing: .05em; }
.book-hits { display: flex; flex-wrap: wrap; gap: 8px; }
.book-hit { display: flex; gap: 10px; align-items: center; padding: 6px 12px 6px 6px; background: var(--panel);
  border-radius: 10px; box-shadow: var(--shadow); color: var(--text); font-size: 14px; }
.book-hit img, .book-hit .ph { width: 30px; height: 42px; border-radius: 3px; object-fit: cover; }
.book-hit small { color: var(--muted); display: block; font-size: 12px; }
.hit { background: var(--panel); border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; box-shadow: var(--shadow); }
.hit .src { font-size: 13px; color: var(--muted); margin-top: 8px; }
.more { display: block; margin: 16px auto; }
.empty { color: var(--muted); text-align: center; padding: 60px 0; }

/* notes */
blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--quote); white-space: pre-wrap; }
.thought { margin-top: 10px; padding: 10px 14px; background: var(--accent-soft); border-radius: 8px; white-space: pre-wrap; font-size: 15px; }
.thought::before { content: "💭 "; }
.when { font-size: 12px; color: var(--faint); margin-top: 6px; }

/* book page */
.book-head { display: flex; gap: 28px; padding: 32px 0 24px; align-items: flex-start; }
.book-head .cover { width: 140px; flex: none; }
.book-head h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.35; }
.book-head .meta { color: var(--muted); font-size: 14px; }
.book-head .meta div { margin: 2px 0; }
.book-head .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-block; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); }
.btn:hover { text-decoration: none; background: var(--accent-soft); }
.layout { display: grid; grid-template-columns: 220px 1fr; gap: 40px; padding-bottom: 80px; }
.toc { position: sticky; top: 84px; align-self: start; max-height: calc(100vh - 100px); overflow: auto; font-size: 13px; }
.toc input { width: 100%; font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); margin-bottom: 10px; outline: none; }
.toc a { display: block; color: var(--muted); padding: 3px 0; line-height: 1.45; }
.toc a span { color: var(--faint); }
.chapter h2 { font-size: 17px; margin: 32px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line); scroll-margin-top: 84px; }
.note { padding: 14px 0; border-bottom: 1px dashed var(--line); }
.note:last-child { border-bottom: 0; }
.review { background: var(--panel); padding: 16px 20px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 12px; white-space: pre-wrap; }
.stars { color: var(--accent); }
.back { display: inline-block; margin-top: 20px; font-size: 14px; color: var(--muted); }

footer { color: var(--faint); font-size: 12px; text-align: center; padding: 24px 0 40px; }

@media (max-width: 720px) {
  .brand span { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px 12px; }
  .book-head { gap: 16px; padding-top: 20px; }
  .book-head .cover { width: 90px; }
  .book-head h1 { font-size: 20px; }
  .layout { grid-template-columns: 1fr; gap: 0; }
  .toc { display: none; }
  .stats { gap: 20px; }
  .stat b { font-size: 21px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#/">📚 <span>读书笔记</span></a>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索书名、作者、划线、想法…  ( / )" autocomplete="off">
    </label>
    <button class="icon-btn" id="theme" title="切换深浅色">◐</button>
  </div>
</header>
<main class="wrap" id="app"><p class="empty">加载中…</p></main>
<footer class="wrap" id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let BOOKS = [], BY_ID = {}, NOTES = [];
const state = { filter: 'all', sort: 'recent', cat: '' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' }) : '';
const total = b => b.counts.highlights + b.counts.thoughts + b.counts.bookmarks;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function hl(text, terms) {
  let h = esc(text);
  if (!terms.length) return h;
  const re = new RegExp('(' + terms.map(t => reEsc(esc(t))).join('|') + ')', 'gi');
  return h.replace(re, '<mark>$1</mark>');
}
function snippet(text, terms, len = 220) {
  if (text.length <= len) return text;
  const low = text.toLowerCase();
  let i = Math.min(...terms.map(t => { const k = low.indexOf(t.toLowerCase()); return k < 0 ? Infinity : k; }));
  if (!isFinite(i)) return text.slice(0, len) + '…';
  const start = Math.max(0, i - 60);
  return (start ? '…' : '') + text.slice(start, start + len) + (start + len < text.length ? '…' : '');
}
function coverImg(b, cls = 'cover') {
  if (!b.cover) return `<div class="${cls} ph">${esc(b.title)}</div>`;
  return `<img class="${cls}" loading="lazy" referrerpolicy="no-referrer" src="${esc(b.cover.replace('/s_', '/t9_'))}" alt="" onerror="this.onerror=null;this.src='${esc(b.cover)}'">`;
}

/* ---------- home ---------- */
function randomNote() {
  const pool = NOTES.filter(n => n.text && n.text.length > 12 && n.text.length < 300);
  return pool[Math.floor(Math.random() * pool.length)];
}
function renderDaily() {
  const n = randomNote(); if (!n) return '';
  const b = BY_ID[n.book];
  return `<div class="daily"><div class="lbl">随机一段 <button onclick="document.querySelector('.daily').outerHTML=renderDaily()">换一段 ↻</button></div>
    <blockquote>${esc(n.text)}</blockquote>
    ${n.thought ? `<div class="thought">${esc(n.thought)}</div>` : ''}
    <div class="src">—— <a href="#/book/${b.id}">《${esc(b.title)}》</a> · ${esc(n.chapter)}</div></div>`;
}
function home() {
  const notes = BOOKS.reduce((s, b) => s + total(b), 0);
  const finished = BOOKS.filter(b => b.finished).length;
  const thoughts = NOTES.filter(n => n.thought).length;
  const cats = [...new Set(BOOKS.map(b => b.category.split('-')[0]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${BOOKS.length}</b><span>本书有笔记</span></div>
      <div class="stat"><b>${notes.toLocaleString()}</b><span>条笔记</span></div>
      <div class="stat"><b>${thoughts.toLocaleString()}</b><span>条想法</span></div>
      <div class="stat"><b>${finished}</b><span>本读完</span></div>
    </div>
    ${renderDaily()}
    <div class="controls">
      ${[['all','全部'],['finished','读完'],['reading','在读']].map(([k,v]) => `<button class="chip ${state.filter===k?'on':''}" data-f="${k}">${v}</button>`).join('')}
      <select class="chip" id="cat"><option value="">全部分类</option>${cats.map(c => `<option ${state.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <span class="spacer"></span>
      <select class="chip" id="sort">
        <option value="recent" ${state.sort==='recent'?'selected':''}>最近笔记</option>
        <option value="count" ${state.sort==='count'?'selected':''}>笔记最多</option>
        <option value="title" ${state.sort==='title'?'selected':''}>书名</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>`;
  app.querySelectorAll('[data-f]').forEach(el => el.onclick = () => { state.filter = el.dataset.f; home(); });
  $('#cat').onchange = e => { state.cat = e.target.value; drawGrid(); };
  $('#sort').onchange = e => { state.sort = e.target.value; drawGrid(); };
  drawGrid();
}
function drawGrid() {
  let list = BOOKS.filter(b => state.filter === 'all' || (state.filter === 'finished') === b.finished);
  if (state.cat) list = list.filter(b => b.category.split('-')[0] === state.cat);
  if (state.sort === 'count') list = [...list].sort((a, b) => total(b) - total(a));
  if (state.sort === 'title') list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'zh'));
  $('#grid').innerHTML = list.map(b => `
    <a class="card" href="#/book/${b.id}">
      ${coverImg(b)}
      <div class="t">${esc(b.title)}</div>
      <div class="a">${esc(b.author)}</div>
      <div class="n">${total(b)} 条笔记${b.finished ? '<span class="badge">读完</span>' : ''}</div>
    </a>`).join('') || '<p class="empty">没有符合条件的书</p>';
}

/* ---------- search ---------- */
let searchLimit = 50;
function search(q) {
  const terms = q.trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return home();
  const low = terms.map(t => t.toLowerCase());
  const has = s => { s = s.toLowerCase(); return low.every(t => s.includes(t)); };
  const books = BOOKS.filter(b => has(`${b.title} ${b.author} ${b.translator} ${b.category}`));
  const notes = NOTES.filter(n => has(n.text + ' ' + n.thought + ' ' + n.chapter));
  app.innerHTML = `<div class="results">
    ${books.length ? `<h3>书籍 · ${books.length}</h3><div class="book-hits">${books.slice(0, 30).map(b => `
      <a class="book-hit" href="#/book/${b.id}">${coverImg(b, 'ph-img')}<div>${hl(b.title, terms)}<small>${hl(b.author, terms)}</small></div></a>`).join('')}</div>` : ''}
    <h3>笔记 · ${notes.length}</h3>
    ${notes.slice(0, searchLimit).map(n => {
      const b = BY_ID[n.book];
      return `<div class="hit">
        ${n.text ? `<blockquote>${hl(snippet(n.text, terms), terms)}</blockquote>` : ''}
        ${n.thought ? `<div class="thought">${hl(snippet(n.thought, terms), terms)}</div>` : ''}
        <div class="src"><a href="#/book/${b.id}/${n.ci}">《${esc(b.title)}》</a> · ${hl(n.chapter, terms)} · ${fmtDate(n.time)}</div>
      </div>`;
    }).join('') || (books.length ? '' : '<p class="empty">没有找到相关内容</p>')}
    ${notes.length > searchLimit ? `<button class="chip more" id="more">显示更多（还有 ${notes.length - searchLimit} 条）</button>` : ''}
  </div>`;
  app.querySelectorAll('.ph-img').forEach(el => el.style.cssText = 'width:30px;height:42px;border-radius:3px;object-fit:cover');
  const m = $('#more'); if (m) m.onclick = () => { searchLimit += 100; search(q); };
}

/* ---------- book page ---------- */
function bookPage(id, ci) {
  const b = BY_ID[id];
  if (!b) { app.innerHTML = '<p class="empty">找不到这本书</p>'; return; }
  const c = b.counts;
  const stars = n => `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`;
  const noteHtml = it => it.type === 'chapter_review'
    ? `<div class="note"><div class="thought" style="background:none;padding:0">📝 章节点评：${esc(it.thought)}</div><div class="when">${fmtDate(it.time)}</div></div>`
    : `<div class="note">${it.text ? `<blockquote>${esc(it.text)}</blockquote>` : ''}${it.thought ? `<div class="thought">${esc(it.thought)}</div>` : ''}<div class="when">${fmtDate(it.time)}</div></div>`;
  app.innerHTML = `
    <a class="back" href="#/">← 全部书籍</a>
    <div class="book-head">
      ${coverImg(b)}
      <div>
        <h1>${esc(b.title)}</h1>
        <div class="meta">
          <div>${esc(b.author)}${b.translator ? ` · 译者 ${esc(b.translator)}` : ''}</div>
          ${b.category ? `<div>${esc(b.category)}</div>` : ''}
          <div>${b.finished ? '已读完' : b.progress != null ? `阅读进度 ${b.progress}%` : ''}</div>
          <div>划线 ${c.highlights} · 想法/点评 ${c.thoughts} · 书签 ${c.bookmarks} · 最近笔记 ${fmtDate(b.updated)}</div>
        </div>
        <div class="actions">${b.link ? `<a class="btn" href="${esc(b.link)}" target="_blank" rel="noopener">在微信读书打开 ↗</a>` : ''}</div>
      </div>
    </div>
    <div class="layout">
      <nav class="toc">
        <input id="inbook" type="search" placeholder="在本书中查找…">
        ${b.reviews.length ? '<a href="javascript:void 0" data-go="rv">书评</a>' : ''}
        ${b.chapters.map((ch, i) => `<a href="javascript:void 0" data-go="${i}">${esc(ch.title)} <span>${ch.items.length}</span></a>`).join('')}
      </nav>
      <div id="body">
        ${b.reviews.length ? `<section class="chapter" id="ch-rv"><h2>书评</h2>${b.reviews.map(r => `<div class="review">${r.star ? stars(r.star) + '\n' : ''}${esc(r.thought)}<div class="when">${fmtDate(r.time)}</div></div>`).join('')}</section>` : ''}
        ${b.chapters.map((ch, i) => `<section class="chapter" id="ch-${i}"><h2>${esc(ch.title)}</h2>${ch.items.map(noteHtml).join('')}</section>`).join('')}
      </div>
    </div>`;
  app.querySelectorAll('[data-go]').forEach(a => a.onclick = () => document.getElementById('ch-' + a.dataset.go)?.scrollIntoView({ behavior: 'smooth' }));
  $('#inbook').oninput = e => {
    const t = e.target.value.trim().toLowerCase();
    app.querySelectorAll('#body .note, #body .review').forEach(n => n.style.display = !t || n.textContent.toLowerCase().includes(t) ? '' : 'none');
    app.querySelectorAll('#body .chapter').forEach(s => s.style.display = [...s.querySelectorAll('.note,.review')].some(n => n.style.display !== 'none') ? '' : 'none');
  };
  if (ci != null) setTimeout(() => document.getElementById('ch-' + ci)?.scrollIntoView(), 0);
  else window.scrollTo(0, 0);
}

/* ---------- routing ---------- */
const q = $('#q');
let qTimer;
q.oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => {
  const v = q.value.trim();
  const h = v ? '#/search/' + encodeURIComponent(v) : '#/';
  if (location.hash !== h) history.replaceState(null, '', h);
  searchLimit = 50; route(); }, 150); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.oninput(); }
});
function route() {
  const [, page, a, b] = location.hash.split('/');
  if (page === 'book') { bookPage(a, b); }
  else if (page === 'search') { const v = decodeURIComponent(a || ''); if (q.value !== v) q.value = v; search(v); }
  else { if (q.value && document.activeElement !== q) q.value = ''; home(); }
}
window.addEventListener('hashchange', route);

/* ---------- theme ---------- */
const themeKey = 'theme';
try { const t = localStorage.getItem(themeKey); if (t) document.documentElement.dataset.theme = t; } catch {}
$('#theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(themeKey, dark ? 'light' : 'dark'); } catch {}
};

/* ---------- load ---------- */
fetch('data.json').then(r => r.json()).then(d => {
  BOOKS = d.books;
  for (const b of BOOKS) {
    BY_ID[b.id] = b;
    b.reviews.forEach(r => NOTES.push({ book: b.id, chapter: '书评', ci: 'rv', text: '', thought: r.thought, time: r.time }));
    b.chapters.forEach((ch, ci) => ch.items.forEach(it =>
      NOTES.push({ book: b.id, chapter: ch.title, ci, text: it.text, thought: it.thought, time: it.time })));
  }
  NOTES.sort((a, b) => b.time - a.time);
  const last = Math.max(...BOOKS.map(b => b.updated));
  $('#foot').innerHTML = `数据来自微信读书 · 最近一条笔记 ${fmtDate(last)} · <a href="https://github.com/melonlala/reading_notes">GitHub</a>`;
  route();
}).catch(e => { app.innerHTML = `<p class="empty">数据加载失败：${esc(e.message)}</p>`; });
</script>
</body>
</html>
